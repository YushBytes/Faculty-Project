services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acadlytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acadlytics}
      POSTGRES_DB: ${POSTGRES_DB:-acadlytics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Dev fallback only; the app refuses to start with it when APP_ENV=production.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-change-me-0123456789abcdef}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-acadlytics}:${POSTGRES_PASSWORD:-acadlytics}@db:5432/${POSTGRES_DB:-acadlytics}
      # First start on an empty database creates the admin / HOD / Academic Head logins.
      ACADLYTICS_INITIAL_PASSWORD: ${ACADLYTICS_INITIAL_PASSWORD:-Demo@2026pass}
      # Faculty found in uploaded TLP reports sign in as <staff id>@<domain> with this.
      FACULTY_DEFAULT_PASSWORD: ${FACULTY_DEFAULT_PASSWORD:-Faculty@2026}
      INSTITUTION_EMAIL_DOMAIN: ${INSTITUTION_EMAIL_DOMAIN:-srmist.edu.in}
      # Only used by the optional `seed-demo` command.
      ACADLYTICS_DEMO_DIR: /tmp/acadlytics-demo
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      ACADLYTICS_API_URL: http://api:8000
      # Local demo over plain http: allow the httpOnly session cookie without the Secure flag.
      ACADLYTICS_INSECURE_COOKIES: "1"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
