# Frontend CI: lint, type check, unit tests and a production build of the Next.js web app.
#
# Lint, type check, unit tests (Vitest: the HTTP client and display helpers) and a production
# build. The browser end-to-end tests (Playwright, `npm run test:e2e`) need a running stack with
# an Administrator account, so they run locally against a throwaway stack, not here; see
# docs/TESTING_AND_VERIFICATION.md.
#
# Node 22 matches frontend/Dockerfile. No API is needed: ACADLYTICS_API_URL is only read at
# request time, so a build does not contact the backend.

name: frontend

on:
  push:
    branches: [main, backend]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, backend]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
